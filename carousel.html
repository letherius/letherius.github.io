<main role="main" class="container-fluid">
    <h2>Carousel</h2>
<div id="photoCarousel" class="carousel slide">

    <div class="carousel-indicators">
        <button type="button"
                data-bs-target="#photoCarousel"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1">
        </button>

        <button type="button"
                data-bs-target="#photoCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2">
        </button>

        <button type="button"
                data-bs-target="#photoCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3">
        </button>

        <button type="button"
                data-bs-target="#photoCarousel"
                data-bs-slide-to="3"
                aria-label="Slide 4">
        </button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="images/truck.jpg"
                 class="d-block w-100"
                 alt="My truck">

            <div class="carousel-caption d-none d-md-block">
                <h5>My Truck</h5>
                <p>A photo of a truck similar to mine.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="images/beach.jpg"
                 class="d-block w-100"
                 alt="A day at the beach">

            <div class="carousel-caption d-none d-md-block">
                <h5>Beach View</h5>
                <p>A relaxing beach view.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="images/city.jpg"
                 class="d-block w-100"
                 alt="City view">

            <div class="carousel-caption d-none d-md-block">
                <h5>City View</h5>
                <p>A view of my city.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="images/food.jpg"
                 class="d-block w-100"
                 alt="A meal">

            <div class="carousel-caption d-none d-md-block">
                <h5>Good Food</h5>
                <p>Things I enjoy.</p>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#photoCarousel"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"
              aria-hidden="true">
        </span>

        <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#photoCarousel"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"
              aria-hidden="true">
        </span>

        <span class="visually-hidden">Next</span>
    </button>

</div>
