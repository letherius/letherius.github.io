<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  >

  <meta name="description" content="">

  <title>Letherius Miller: About</title>

  <link
    rel="canonical"
    href="https://getbootstrap.com/docs/4.0/examples/starter-template/"
  >

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link href="css/styles.css" rel="stylesheet">

  <!-- React -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
</head>

<body>

  <!-- Main navigation -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container-fluid">

      <a class="navbar-brand" href="index.html">Letherius Miller</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavigation"
        aria-controls="mainNavigation"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav me-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="grid.html">Grid</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="carousel.html">Carousel</a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              aria-current="page"
              href="about.html"
            >
              About
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="projects.html">Projects</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="skills.html">Skills</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <main role="main" class="container-fluid">

    <div id="h1"></div>
    <div id="img"></div>
    <div id="content"></div>

    <script>
      const user = {
        name: 'Letherius Miller',
        imageUrl: 'images/about.jpg',
        bio: 'My name is Letherius Miller. I work in IT support and I am currently earning my bachelor’s degree in software development. I enjoy learning more about web development, building practical projects, and spending time with my family.'
      };

      // Step one - Create React elements
      const heading = React.createElement(
        'h1',
        null,
        'About ' + user.name
      );

      const image = React.createElement('img', {
        src: user.imageUrl,
        alt: 'Photo of ' + user.name,
        width: 200,
        height: 200
      });

      const paragraph = React.createElement(
        'p',
        null,
        user.bio
      );

      // Step two - Render the React elements
      ReactDOM.render(
        heading,
        document.getElementById('h1')
      );

      ReactDOM.render(
        image,
        document.getElementById('img')
      );

      ReactDOM.render(
        paragraph,
        document.getElementById('content')
      );
    </script>

  </main>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
